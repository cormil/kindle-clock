<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="60">
  <title>Kindle Clock Landscape</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      overflow: hidden;
      position: relative;
    }
    
    /* Il contenitore che verrà ruotato e ridimensionato da JavaScript */
    #wrapper {
      position: absolute;
      top: 0;
      left: 0;
      display: table;
      text-align: center;
      -webkit-transform-origin: center center;
      transform-origin: center center;
    }

    .cell {
      display: table-cell;
      vertical-align: middle;
    }

    #clock {
      font-weight: bold;
      line-height: 1;
      letter-spacing: -2px;
    }

    #date {
      margin-top: 20px;
      font-weight: normal;
      text-transform: capitalize;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div class="cell">
      <div id="clock">--:--</div>
      <div id="date">--</div>
    </div>
  </div>

  <script>
    var giorni = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
    var mesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

    function updateClock() {
      var d = new Date();
      
      // Correzione fuso orario di Roma
      if (d.getTimezoneOffset() === 0) {
        var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
        d = new Date(utc + (3600000 * 2)); // Cambiare a 1 in ora solare
      }

      var h = d.getHours();
      var m = d.getMinutes();
      
      if (h < 10) { h = '0' + h; }
      if (m < 10) { m = '0' + m; }
      
      document.getElementById('clock').innerHTML = h + ':' + m;

      var giornoSettimana = giorni[d.getDay()];
      var giornoMese = d.getDate();
      var mese = mesi[d.getMonth()];
      var anno = d.getFullYear();

      document.getElementById('date').innerHTML = giornoSettimana + ', ' + giornoMese + ' ' + mese + ' ' + anno;
    }
    
    function layoutForLandscape() {
      var w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      var h = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      
      var wrapper = document.getElementById('wrapper');
      
      // Inverte le dimensioni: la larghezza diventa l'altezza e viceversa
      wrapper.style.width = h + 'px';
      wrapper.style.height = w + 'px';
      
      // Calcola le coordinate esatte per centrare il contenitore prima di ruotarlo
      var shiftX = (w - h) / 2;
      var shiftY = (h - w) / 2;
      
      // Applica la rotazione usando il prefisso WebKit per la massima compatibilità col Kindle
      var transformStyle = 'translate(' + shiftX + 'px, ' + shiftY + 'px) rotate(90deg)';
      wrapper.style.webkitTransform = transformStyle;
      wrapper.style.transform = transformStyle;
      
      // Adatta il font in base alla "nuova" larghezza (che è h)
      if (h > 0) {
        document.getElementById('clock').style.fontSize = Math.floor(h * 0.35) + 'px';
        document.getElementById('date').style.fontSize = Math.floor(h * 0.05) + 'px';
      }
    }

    // Avvia l'orologio e il layout
    layoutForLandscape();
    updateClock();
  </script>
</body>
</html>
