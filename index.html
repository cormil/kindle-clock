<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="60">
  <title>Kindle Clock</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #000000;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    #clock {
      font-size: 28vw;
      font-weight: bold;
      letter-spacing: -2px;
    }
  </style>
</head>
<body>
  <div id="clock">--:--</div>
  <script>
    function updateClock() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      
      // Formattazione compatibile con vecchi browser
      if (h < 10) { h = '0' + h; }
      if (m < 10) { m = '0' + m; }
      
      document.getElementById('clock').innerHTML = h + ':' + m;
    }
    updateClock();
  </script>
</body>
</html>
