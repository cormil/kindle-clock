<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Kindle Clock Landscape</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      overflow: hidden;
      position: relative;
    }
    
    #wrapper {
      position: absolute;
      top: 0;
      left: 0;
      display: table;
      text-align: center;
      -webkit-transform-origin: center center;
      transform-origin: center center;
    }

    .cell {
      display: table-cell;
      vertical-align: middle;
    }

    #clock {
      font-weight: bold;
      line-height: 1;
      letter-spacing: -2px;
    }

    #date {
      margin-top: 16px;
      font-weight: normal;
      text-transform: capitalize;
    }

    #weather {
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div id="wrapper">
    <div class="cell">
      <div id="clock">--:--</div>
      <div id="date">--</div>
      <div id="weather">Meteo: --</div>
    </div>
  </div>

  <script>
    var giorni = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
    var mesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
    var lastTime = "";

    // Coordinate di Roma
    var lat = 41.9028;
    var lon = 12.4964;

    function getItalyOffset(date) {
      var year = date.getFullYear();
      
      var startDst = new Date(year, 2, 31);
      startDst.setDate(31 - startDst.getDay());
      startDst.setHours(2, 0, 0, 0);
      
      var endDst = new Date(year, 9, 31);
      endDst.setDate(31 - endDst.getDay());
      endDst.setHours(3, 0, 0, 0);
      
      if (date >= startDst && date < endDst) {
        return 2;
      } else {
        return 1;
      }
    }

    function getWeatherDescription(code) {
      if (code === 0) return 'Sereno';
      if (code === 1 || code === 2) return 'Poco nuvoloso';
      if (code === 3) return 'Nuvoloso';
      if (code === 45 || code === 48) return 'Nebbia';
      if (code >= 51 && code <= 57) return 'Pioviggine';
      if (code >= 61 && code <= 67) return 'Pioggia';
      if (code >= 71 && code <= 77) return 'Neve';
      if (code >= 80 && code <= 82) return 'Rovesci';
      if (code >= 85 && code <= 86) return 'Rovesci neve';
      if (code >= 95) return 'Temporale';
      return 'Variabile';
    }

    function updateWeather() {
      var url = 'https://api.open-meteo.com/v1/forecast' +
                '?latitude=' + lat +
                '&longitude=' + lon +
                '&current=temperature_2m,weather_code' +
                '&daily=weather_code,temperature_2m_max,temperature_2m_min' +
                '&timezone=Europe%2FRome' +
                '&forecast_days=1';

      var xhr = new XMLHttpRequest();
      xhr.open('GET', url, true);
      xhr.timeout = 10000;

      xhr.onreadystatechange = function() {
        if (xhr.readyState === 4) {
          if (xhr.status === 200 && xhr.responseText) {
            try {
              var data = JSON.parse(xhr.responseText);
              var currTemp = Math.round(data.current.temperature_2m);
              var minTemp = Math.round(data.daily.temperature_2m_min[0]);
              var maxTemp = Math.round(data.daily.temperature_2m_max[0]);
              var desc = getWeatherDescription(data.daily.weather_code[0]);

              document.getElementById('weather').innerHTML =
                desc + ' · ' + currTemp + '° (min ' + minTemp + '° / max ' + maxTemp + '°)';
            } catch (e) {
              // Mantiene l'ultimo valore valido in caso di errore di parsing
            }
          }
        }
      };

      xhr.send(null);
    }

    function updateClock() {
      var d = new Date();
      
      if (d.getTimezoneOffset() === 0) {
        var utc = d.getTime() + (d.getTimezoneOffset() * 60000);
        var currentOffset = getItalyOffset(d);
        d = new Date(utc + (3600000 * currentOffset));
      }

      var h = d.getHours();
      var m = d.getMinutes();
      
      if (h < 10) { h = '0' + h; }
      if (m < 10) { m = '0' + m; }
      var newTime = h + ':' + m;
      
      if (newTime !== lastTime) {
        document.getElementById('clock').innerHTML = newTime;

        var giornoSettimana = giorni[d.getDay()];
        var giornoMese = d.getDate();
        var mese = mesi[d.getMonth()];
        var anno = d.getFullYear();

        document.getElementById('date').innerHTML = giornoSettimana + ', ' + giornoMese + ' ' + mese + ' ' + anno;
        lastTime = newTime;
      }
    }
    
    function layoutForLandscape() {
      var w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      var h = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      
      var wrapper = document.getElementById('wrapper');
      
      wrapper.style.width = h + 'px';
      wrapper.style.height = w + 'px';
      
      var shiftX = (w - h) / 2;
      var shiftY = (h - w) / 2;
      
      var transformStyle = 'translate(' + shiftX + 'px, ' + shiftY + 'px) rotate(90deg)';
      wrapper.style.webkitTransform = transformStyle;
      wrapper.style.transform = transformStyle;
      
      if (h > 0) {
        document.getElementById('clock').style.fontSize = Math.floor(h * 0.30) + 'px';
        document.getElementById('date').style.fontSize = Math.floor(h * 0.045) + 'px';
        document.getElementById('weather').style.fontSize = Math.floor(h * 0.04) + 'px';
      }
    }

    layoutForLandscape();
    updateClock();
    updateWeather();

    setInterval(updateClock, 10000);
    setInterval(updateWeather, 1800000); // Aggiorna il meteo ogni 30 minuti
  </script>
</body>
</html>
