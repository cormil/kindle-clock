<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="60">
  <title>Kindle Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      overflow: hidden;
    }
    /* Tabella per centrare verticalmente e orizzontalmente in modo compatibile */
    .container {
      display: table;
      width: 100%;
      height: 100%;
      text-align: center;
    }
    .cell {
      display: table-cell;
      vertical-align: middle;
    }
    #clock {
      /* Dimensione molto grande ottimizzata per e-Ink */
      font-size: 35pt;
      font-weight: bold;
      line-height: 1;
      letter-spacing: -2px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cell">
      <div id="clock">--:--</div>
    </div>
  </div>

  <script>
    function updateClock() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      
      if (h < 10) { h = '0' + h; }
      if (m < 10) { m = '0' + m; }
      
      document.getElementById('clock').innerHTML = h + ':' + m;
    }
    
    // Regola la dimensione del testo in base alla larghezza dello schermo del Kindle
    function fitText() {
      var w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      if (w > 0) {
        // Imposta la dimensione del font a circa il 38% della larghezza dello schermo
        document.getElementById('clock').style.fontSize = Math.floor(w * 0.38) + 'px';
      }
    }

    updateClock();
    fitText();
  </script>
</body>
</html>
