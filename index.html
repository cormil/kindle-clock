<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="60">
  <title>Kindle Clock</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: sans-serif;
      overflow: hidden;
    }
    .container {
      display: table;
      width: 100%;
      height: 100%;
      text-align: center;
    }
    .cell {
      display: table-cell;
      vertical-align: middle;
    }
    #clock {
      font-size: 35pt;
      font-weight: bold;
      line-height: 1;
      letter-spacing: -2px;
    }
    #date {
      margin-top: 20px;
      font-size: 18pt;
      font-weight: normal;
      text-transform: capitalize;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="cell">
      <div id="clock">--:--</div>
      <div id="date">--</div>
    </div>
  </div>

  <script>
    var giorni = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
    var mesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];

    function updateClock() {
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      
      if (h < 10) { h = '0' + h; }
      if (m < 10) { m = '0' + m; }
      
      document.getElementById('clock').innerHTML = h + ':' + m;

      // Formattazione data senza librerie esterne
      var giornoSettimana = giorni[now.getDay()];
      var giornoMese = now.getDate();
      var mese = mesi[now.getMonth()];
      var anno = now.getFullYear();

      document.getElementById('date').innerHTML = giornoSettimana + ', ' + giornoMese + ' ' + mese + ' ' + anno;
    }
    
    function fitText() {
      var w = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      if (w > 0) {
        document.getElementById('clock').style.fontSize = Math.floor(w * 0.35) + 'px';
        document.getElementById('date').style.fontSize = Math.floor(w * 0.05) + 'px';
      }
    }

    updateClock();
    fitText();
  </script>
</body>
</html>
